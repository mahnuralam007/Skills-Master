<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEX CHEN | INTERACTIVE</title>
    <style>
        :root {
            --bg: #050505;
            --accent: #00ff88;
            --secondary: #00d2ff;
        }

        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            /* Fallback will happen if not loaded, but I'll try to use standard sans */
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        /* The 3D World */
        .scene {
            position: relative;
            transform-style: preserve-3d;
            animation: float 6s ease-in-out infinite;
        }

        .cube {
            width: 200px;
            height: 200px;
            position: relative;
            transform-style: preserve-3d;
            animation: rotate 20s linear infinite;
        }

        .face {
            position: absolute;
            width: 200px;
            height: 200px;
            border: 2px solid var(--accent);
            background: rgba(0, 255, 136, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 2rem;
            color: var(--accent);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
        }

        .front {
            transform: translateZ(100px);
        }

        .back {
            transform: rotateY(180deg) translateZ(100px);
        }

        .right {
            transform: rotateY(90deg) translateZ(100px);
        }

        .left {
            transform: rotateY(-90deg) translateZ(100px);
        }

        .top {
            transform: rotateX(90deg) translateZ(100px);
        }

        .bottom {
            transform: rotateX(-90deg) translateZ(100px);
        }

        @keyframes rotate {
            0% {
                transform: rotateX(0) rotateY(0);
            }

            100% {
                transform: rotateX(360deg) rotateY(360deg);
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(-20px);
            }

            50% {
                transform: translateY(20px);
            }
        }

        /* UI Overlay */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            /* Let clicks pass through to 3d objects if we had them */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            box-sizing: border-box;
            background: radial-gradient(circle at center, transparent 0%, var(--bg) 90%);
        }

        header {
            display: flex;
            justify-content: space-between;
            pointer-events: auto;
        }

        .logo {
            font-weight: 900;
            font-size: 1.5rem;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--accent);
        }

        .menu {
            display: flex;
            gap: 20px;
        }

        .menu a {
            color: #fff;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .menu a:hover {
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent);
        }

        .hero-content {
            text-align: center;
            pointer-events: auto;
            z-index: 10;
        }

        h1 {
            font-size: 4rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 5px;
            mix-blend-mode: overlay;
        }

        .btn {
            margin-top: 30px;
            display: inline-block;
            padding: 15px 40px;
            border: 1px solid var(--secondary);
            color: var(--secondary);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            background: var(--secondary);
            color: var(--bg);
            box-shadow: 0 0 30px var(--secondary);
        }

        .cursor {
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-radius: 50%;
            position: absolute;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 999;
            transition: width 0.2s, height 0.2s;
            mix-blend-mode: difference;
        }
    </style>
</head>

<body>
    <div class="cursor" id="cursor"></div>

    <div class="scene">
        <div class="cube">
            <div class="face front">CODE</div>
            <div class="face back">DESIGN</div>
            <div class="face right">BUILD</div>
            <div class="face left">SCALE</div>
            <div class="face top"></div>
            <div class="face bottom"></div>
        </div>
    </div>

    <div class="ui-layer">
        <header>
            <div class="logo">ALEX.DEV</div>
            <nav class="menu">
                <a href="#">Projects</a>
                <a href="#">Exp</a>
                <a href="#">Contact</a>
            </nav>
        </header>

        <div class="hero-content">
            <h1>Immersive<br>Engineering</h1>
            <a href="#" class="btn" onmouseenter="expandCursor()" onmouseleave="shrinkCursor()">Enter Portfolio</a>
        </div>

        <footer>
            <small>EST. 2026 // SYSTEM OPERATIONAL</small>
        </footer>
    </div>

    <script>
        const cursor = document.getElementById('cursor');

        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        function expandCursor() {
            cursor.style.width = '50px';
            cursor.style.height = '50px';
            cursor.style.background = '#fff';
        }

        function shrinkCursor() {
            cursor.style.width = '20px';
            cursor.style.height = '20px';
            cursor.style.background = 'transparent';
        }
    </script>
</body>

</html>
